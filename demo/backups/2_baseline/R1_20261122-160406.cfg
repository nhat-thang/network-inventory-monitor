# system id = pNwYzAOYZKB
#
/interface ethernet
set [ find default-name=ether1 ] disable-running-check=no
set [ find default-name=ether2 ] disable-running-check=no
set [ find default-name=ether3 ] disable-running-check=no
set [ find default-name=ether4 ] disable-running-check=no
set [ find default-name=ether5 ] disable-running-check=no
set [ find default-name=ether6 ] disable-running-check=no
set [ find default-name=ether7 ] disable-running-check=no
set [ find default-name=ether8 ] disable-running-check=no
/routing ospf instance
add name=default-v2 router-id=1.1.1.1
/routing ospf area
add instance=default-v2 name=backbone-v2
/ip neighbor discovery-settings
set discover-interface-list=all
/ip address
add address=192.168.100.11/24 comment=Management interface=ether1 network=192.168.100.0
add address=10.0.12.1/30 comment=ospf-link interface=ether2 network=10.0.12.0
add address=10.0.13.1/30 comment=ospf-link interface=ether3 network=10.0.13.0
/ip dhcp-client
add interface=ether1 name=client1
/ip service
set telnet disabled=yes
/routing ospf interface-template
add area=backbone-v2 networks=10.0.12.0/30
add area=backbone-v2 networks=10.0.13.0/30
/system identity
set name=R1-MikroTik
/system note
set note="Thiet bi thuoc lab Nhom 1 - chi nguoi co tham quyen moi duoc truy cap"
